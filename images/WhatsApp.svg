<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      .pulse-bg {
        fill: none;
        stroke: #60A5FA;
        stroke-width: 2;
        animation: ringPulse 2s infinite ease-out;
        transform-origin: 50px 50px;
      }
      .chat-bubble {
        fill: #1D4ED8;
        stroke: #EFF6FF;
        stroke-width: 2.5;
        animation: bubbleBounce 2.5s infinite ease-in-out;
        transform-origin: 50px 50px;
      }
      .phone-icon {
        fill: #FFFFFF;
      }

      @keyframes ringPulse {
        0% { r: 30px; opacity: 1; }
        100% { r: 46px; opacity: 0; }
      }
      @keyframes bubbleBounce {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </defs>

  <!-- Ondas de notificación -->
  <circle cx="50" cy="50" r="30" class="pulse-bg" />
  <circle cx="50" cy="50" r="30" class="pulse-bg" style="animation-delay: 0.7s;" />

  <!-- Globo de WhatsApp -->
  <path d="M 50 18 C 32.3 18 18 32.3 18 50 C 18 56.1 19.7 61.8 22.7 66.7 L 19 81 L 33.7 77.2 C 38.4 79.9 44 81.5 50 81.5 C 67.7 81.5 82 67.2 82 49.5 C 82 31.8 67.7 18 50 18 Z" class="chat-bubble" />

  <!-- Auricular de Teléfono -->
  <path d="M 62.5 56.8 C 61.3 56.2 55.4 53.3 54.3 52.9 C 53.2 52.5 52.4 52.3 51.6 53.5 C 50.8 54.7 48.5 57.4 47.8 58.2 C 47.1 59 46.4 59.1 45.2 58.5 C 44 57.9 40.1 56.6 35.5 52.5 C 31.9 49.3 29.5 45.4 28.8 44.2 C 28.1 43 28.7 42.3 29.3 41.7 C 29.8 41.2 30.5 40.3 31.1 39.6 C 31.7 38.9 31.9 38.4 32.3 37.6 C 32.7 36.8 32.5 36.1 32.2 35.5 C 31.9 34.9 29.6 29.3 28.6 27 C 27.7 24.7 26.8 25 26.1 25 C 25.5 25 24.7 25 23.9 25 C 23.1 25 21.8 25.3 20.7 26.5 C 19.6 27.7 16.5 30.6 16.5 36.5 C 16.5 42.4 20.8 48.1 21.4 48.9 C 22 49.7 29.8 61.6 41.8 66.8 C 44.6 68 46.9 68.8 48.6 69.3 C 51.5 70.2 54.1 70.1 56.2 69.8 C 58.5 69.5 63.3 66.9 64.3 64.1 C 65.3 61.3 65.3 58.9 65 58.4 C 64.7 57.9 63.7 57.4 62.5 56.8 Z" class="phone-icon" />
</svg>
