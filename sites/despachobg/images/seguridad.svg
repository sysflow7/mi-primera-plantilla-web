<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80" class="sec-icon-1">
  <defs>
    <!-- Gradientes en tonalidad azul -->
    <linearGradient id="shieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="innerGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Filtro de Sombra -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .sec-icon-1 {
      cursor: pointer;
      overflow: visible;
    }
    .sec-icon-1 .shield-main {
      transform-origin: 50px 50px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sec-icon-1 .pulse-ring {
      transform-origin: 50px 50px;
      opacity: 0;
      transition: all 0.4s ease;
    }
    .sec-icon-1 .check-mark {
      stroke-dasharray: 40;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s ease;
    }

    /* Animación Hover */
    .sec-icon-1:hover .shield-main {
      transform: scale(1.08);
    }
    .sec-icon-1:hover .pulse-ring {
      animation: shieldPulse 1.2s infinite;
    }

    @keyframes shieldPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.35); opacity: 0; }
    }
  </style>

  <!-- Anillo de Pulso -->
  <path class="pulse-ring" d="M 50 12 L 80 26 C 80 56 50 82 50 82 C 50 82 20 56 20 26 Z" 
        fill="none" stroke="#93C5FD" stroke-width="3" />

  <!-- Escudo Base -->
  <g class="shield-main" filter="url(#glow1)">
    <!-- Cuerpo del Escudo -->
    <path d="M 50 15 L 78 28 C 78 55 50 78 50 78 C 50 78 22 55 22 28 Z" 
          fill="url(#shieldGrad1)" stroke="#3B82F6" stroke-width="2" />
    
    <!-- Detalle Interior -->
    <path d="M 50 22 L 72 33 C 72 54 50 71 50 71 C 50 71 28 54 28 33 Z" 
          fill="url(#innerGrad1)" opacity="0.4" />

    <!-- Icono Check de Verificación -->
    <path class="check-mark" d="M 38 46 L 47 55 L 63 38" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
