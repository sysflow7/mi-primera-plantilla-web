<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__SEO_TITLE__</title>
<meta name="description" content="__SEO_DESCRIPTION__">
<meta name="robots" content="__ROBOTS__">
<link rel="canonical" href="__CANONICAL_URL__">
<link rel="icon" href="__FAVICON_URL__">
<meta name="theme-color" content="__PRIMARY_COLOR__">
<meta property="og:type" content="website">
<meta property="og:title" content="__SEO_TITLE__">
<meta property="og:description" content="__SEO_DESCRIPTION__">
<meta property="og:url" content="__CANONICAL_URL__">
<meta property="og:image" content="__SOCIAL_IMAGE_URL__">
<link rel="stylesheet" href="mini/style.css">
</head>
<body>
<header class="mini-header">
  <a class="mini-brand" href="/" aria-label="Inicio">
    <img id="mini-logo" src="__LOGO_IMAGE_URL__" alt="Logo de __BUSINESS_NAME__">
    <span id="mini-business-name">__BUSINESS_NAME__</span>
  </a>
</header>

<main>
  <section id="mini-hero" class="mini-hero">
    <div class="mini-hero-content">
      <p id="mini-slogan" class="mini-eyebrow"></p>
      <h1 id="mini-title">__BUSINESS_NAME__</h1>
      <p id="mini-hero-text"></p>
      <a id="mini-whatsapp-hero" class="mini-button" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    </div>
    <div id="mini-hero-media" class="mini-hero-media" hidden>
      <img id="mini-hero-image" alt="">
    </div>
  </section>

  <section id="mini-presentacion" class="mini-section" hidden>
    <h2 id="mini-presentacion-title"></h2>
    <p id="mini-presentacion-text"></p>
  </section>

  <section id="mini-productos" class="mini-section" hidden>
    <h2 id="mini-productos-title"></h2>
    <div id="mini-productos-list" class="mini-cards"></div>
  </section>

  <section id="mini-contacto" class="mini-section mini-contact" hidden>
    <h2 id="mini-contacto-title">Contáctanos</h2>
    <div class="mini-contact-grid">
      <a id="mini-whatsapp" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a id="mini-telefono" target="_blank" rel="noopener noreferrer" hidden>Teléfono</a>
      <a id="mini-email" target="_blank" rel="noopener noreferrer" hidden>Email</a>
    </div>
  </section>

  <section id="mini-ubicacion" class="mini-section" hidden>
    <h2 id="mini-ubicacion-title"></h2>
    <p id="mini-direccion"></p>
    <p id="mini-zona"></p>
    <p id="mini-area"></p>
    <p id="mini-horarios"></p>
    <a id="mini-como-llegar" class="mini-link" target="_blank" rel="noopener noreferrer" hidden>Cómo llegar</a>
  </section>

  <section id="mini-redes" class="mini-section" hidden>
    <h2>También puedes encontrarnos en</h2>
    <div id="mini-redes-list" class="mini-social"></div>
  </section>

  <section id="mini-compartir" class="mini-share" hidden>
    <button id="mini-share-button" type="button">↗ Compartir negocio</button>
  </section>
</main>

<footer class="mini-footer">
  <strong>SIDeN</strong>
  <span id="mini-footer-name">__BUSINESS_NAME__</span>
  <span>© <span id="mini-year"></span></span>
</footer>

<script src="mini/script.js"></script>
</body>
</html>
